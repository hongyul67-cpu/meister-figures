<text x="90" y="2080" font-size="15" font-weight="700" fill="#1F3864">스마트설비 실습실 → AMR 운용 실습실</text>
<text x="90" y="2099" font-size="12.5" fill="#666">AMR 운용(10학점) 실습실이 배치도에 없었음. 113~114쪽 기자재 계획에는 이미 편성</text>

<text x="90" y="2126" font-size="15" font-weight="700" fill="#1F3864">스마트설계 실습실 → 과정평가형 운영실</text>
<text x="90" y="2145" font-size="12.5" fill="#666">외부평가 시험위원 상주·채점·시험자료 보관 공간이 없었음</text>
<circle cx="70" cy="2174" r="11" fill="#C00000"/>
<text x="70" y="2178.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text>
<text x="90" y="2172" font-size="15" font-weight="700" fill="#1F3864">프로젝트실 → 인접 재료실 통합 확장</text>
<text x="90" y="2191" font-size="12.5" fill="#666">캡스톤 디자인 3-2 분반 24시간 + 방과후·주말 상시 개방 대비 면적 부족</text>
<circle cx="70" cy="2220" r="11" fill="#C00000"/>

<text x="90" y="2218" font-size="15" font-weight="700" fill="#1F3864">기계소프트웨어개발2 → 자격 대비 자율실습실</text>
<text x="90" y="2237" font-size="12.5" fill="#666">본문 205쪽 방과후 '자동화설비산업기사 주 2회'에 전용 공간 미지정</text>

<text x="1180" y="2148" font-size="13.5" font-weight="700" fill="#2E7D32">불필요</text>
<text x="1024" y="2180" font-size="12" fill="#888">분반 : 학급 정원 18~20명, 13명 이상이면 분반</text>
<text x="1024" y="2198" font-size="12" fill="#888">→ 9~10명 2개조 / 실습실 1실 주당 34시간</text>

<text x="1514" y="2048" font-size="16" font-weight="700" fill="#B03A3A">확인 필요</text>
<text x="1514" y="2074" font-size="12.5" fill="#8A4A4A">AI융합기계과가 창조관 1층을 사용하지</text>
<text x="1514" y="2093" font-size="12.5" fill="#8A4A4A">않는 것으로 확인되어(2026-08-26),</text>
<text x="1514" y="2112" font-size="12.5" fill="#8A4A4A">원도면상 자동화기계과 구역은</text>
<text x="1514" y="2131" font-size="12.5" fill="#8A4A4A">'배정 협의 필요'로 표기했습니다.</text>
